[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sscre"
version = "0.1.0"
description = "Safe Semantic LLM Response Reuse"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
sscre-evaluate = "sscre.evaluate:main"
sscre-storage-evaluate = "sscre.storage_evaluation:main"
sscre-migrate = "sscre.migrate:main"
sscre-load-test = "sscre.load_test:main"
sscre-gallery-export = "sscre.gallery_export:main"
sscre-failure-gallery-export = "sscre.failure_gallery_export:main"
sscre-dashboard-export = "sscre.dashboard:main"
sscre-dual-model = "sscre.dual_model:main"
sscre-env-validate = "sscre.env_validate:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
local-embeddings = [
    "sentence-transformers>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "local_embedding: opt-in tests that load the registered local embedding model",
    "real_provider: opt-in tests that make bounded remote provider requests",
    "ws8_postgres_failure_recovery: opt-in WS8 PostgreSQL failure/recovery harness",
    "ws8_postgres_multiprocess: opt-in WS8 multi-process duplicate-generation harness",
    "ws8_postgres_contention: opt-in WS8 PostgreSQL contention/uniqueness/eviction harness",
    "ws8_postgres_load: opt-in WS8 bounded PostgreSQL load verification",
]
addopts = "-m 'not ws8_postgres_failure_recovery and not ws8_postgres_multiprocess and not ws8_postgres_contention and not ws8_postgres_load'"
